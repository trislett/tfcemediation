[build-system]
requires = [
    "setuptools>=61.0",
    "wheel",
    "Cython>=0.29.0",
    "numpy>=1.19.0"
]
build-backend = "setuptools.build_meta"

[project]
name = "tfcemediation"
description = "Fast regression and mediation analysis of vertex or voxel MRI data with TFCE"
readme = "README.md"  # Add if you have a README file
license = {text = "GPL-3.0-or-later"}
authors = [
    {name = "Tristram Lett", email = "tris.lett@gmail.com"}
]
maintainers = [
    {name = "Tristram Lett", email = "tris.lett@gmail.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Topic :: Scientific/Engineering :: Medical Science Apps."
]
dynamic = ["version"]
requires-python = ">=3.7"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "nibabel",
    "cython",
    "scikit-learn",
    "scikit-image",
    "joblib",
    "pandas",
    "tqdm",
    "statsmodels"
]

[project.urls]
Homepage = "https://github.com/trislett/tfcemediation"
Repository = "https://github.com/trislett/tfcemediation"

[tool.setuptools]
include-package-data = true
zip-safe = false

[tool.setuptools.packages.find]
# This will find all packages automatically

[tool.setuptools.package-data]
tfcemediation = [
    "static/*",
    "libs/*", 
    "static/aseg-subcortical-Surf/*",
    "static/JHU-ICBM-Surf/*",
    "static/aseg-other-Surf/*"
]

[tool.setuptools.dynamic]
version = {attr = "tfcemediation.version.__version__"}
